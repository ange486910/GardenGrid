name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['24.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Security scan
        run: node scripts/security-check.mjs
      - name: Full verification pass 1
        run: node scripts/verify.mjs
      - name: Full verification pass 2
        run: node scripts/verify.mjs