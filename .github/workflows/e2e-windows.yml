name: e2e-windows
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Browser integration tests
        run: node --test tests/browser/*.test.js